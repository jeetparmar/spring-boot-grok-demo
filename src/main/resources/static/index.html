<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Boot Grok Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f9;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-height: 100vh; padding: 32px 16px; }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #e1e6ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
    }

    header { padding: 20px 24px; border-bottom: 1px solid #e8ebf1; }
    h1 { margin: 0; font-size: 1.15rem; }
    header p { margin: 5px 0 0; color: #667085; font-size: .9rem; }

    #log {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: min(62vh, 560px);
      min-height: 300px;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .message { max-width: 90%; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }
    .label { margin: 0 0 5px; color: #667085; font-size: .75rem; font-weight: 650; }
    .user .label { text-align: right; }

    .content {
      padding: 12px 15px;
      border: 1px solid #e6e9ef;
      border-radius: 14px;
      background: #f7f8fb;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .user .content { border-color: #2357d8; background: #2357d8; color: white; }
    .content > :first-child { margin-top: 0; }
    .content > :last-child { margin-bottom: 0; }
    .content p { margin: .65em 0; }
    .content h1, .content h2, .content h3, .content h4 { margin: 1em 0 .45em; line-height: 1.3; }
    .content h1 { font-size: 1.35rem; }
    .content h2 { font-size: 1.2rem; }
    .content h3, .content h4 { font-size: 1.05rem; }
    .content ul, .content ol { margin: .5em 0; padding-left: 1.5em; }
    .content blockquote { margin: .7em 0; padding-left: 12px; border-left: 3px solid #b8c2d5; color: #596579; }
    .content pre { overflow-x: auto; margin: .7em 0; padding: 12px; border-radius: 8px; background: #172033; color: #eef2ff; }
    .content code { padding: .12em .35em; border-radius: 4px; background: #e9edf4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    .content pre code { padding: 0; background: transparent; color: inherit; }
    .content a { color: #1748bd; text-decoration: underline; }
    .content hr { border: 0; border-top: 1px solid #dfe4ec; }
    .table-wrap { max-width: 100%; overflow-x: auto; margin: .8em 0; }
    .content table { width: 100%; border-collapse: collapse; text-align: left; }
    .content th, .content td { padding: 9px 11px; border: 1px solid #dfe4ec; vertical-align: top; }
    .content th { background: #eef2f8; font-weight: 650; }

    form { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid #e8ebf1; }
    input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #cfd5df;
      border-radius: 9px;
      font: inherit;
    }

    input:focus { outline: 3px solid rgb(35 87 216 / 18%); border-color: #2357d8; }
    button { padding: 0 18px; border: 0; border-radius: 9px; background: #2357d8; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error .content { border-color: #f1c4c4; background: #fff5f5; color: #a32121; }
    .pending .content { color: #667085; font-style: italic; }

    @media (max-width: 520px) {
      body { padding: 0; }
      main { min-height: 100vh; border: 0; border-radius: 0; }
      #log { height: calc(100vh - 150px); min-height: 240px; padding: 18px 14px; }
      header { padding: 17px 16px; }
      form { padding: 12px 14px; }
      .message { max-width: 96%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Spring Boot Grok Demo</h1>
      <p>Ask a question to get started.</p>
    </header>
    <section id="log" aria-live="polite" aria-label="Conversation"></section>
    <form id="chat-form">
      <input id="msg" name="message" placeholder="Ask something..." autocomplete="off" autofocus required>
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('msg');
    const sendButton = document.getElementById('send-button');

    form.addEventListener('submit', event => {
      event.preventDefault();
      send();
    });

    function addMessage(role, text, state = '') {
      const message = document.createElement('article');
      message.className = `message ${role}${state ? ` ${state}` : ''}`;

      const label = document.createElement('p');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : 'AI';

      const content = document.createElement('div');
      content.className = 'content';
      if (role === 'assistant' && !state) {
        renderMarkdown(content, text);
      } else {
        content.textContent = text;
      }

      message.append(label, content);
      log.appendChild(message);
      log.scrollTop = log.scrollHeight;
      return message;
    }

    function appendInline(parent, text) {
      const pattern = /(`[^`]+`|\*\*[^*]+\*\*|__[^_]+__|\*[^*]+\*|_[^_]+_|!\[([^\]]*)\]\(([^)]+)\)|\[([^\]]+)\]\(([^)]+)\))/g;
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        parent.append(document.createTextNode(text.slice(lastIndex, match.index)));
        const token = match[0];
        let element;

        if (token.startsWith('`')) {
          element = document.createElement('code');
          element.textContent = token.slice(1, -1);
        } else if (token.startsWith('**') || token.startsWith('__')) {
          element = document.createElement('strong');
          element.textContent = token.slice(2, -2);
        } else if (token.startsWith('*') || token.startsWith('_')) {
          element = document.createElement('em');
          element.textContent = token.slice(1, -1);
        } else {
          const labelText = match[4] ?? match[2];
          const href = match[5] ?? match[3];
          try {
            const url = new URL(href, window.location.origin);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
              element = document.createElement('a');
              element.href = url.href;
              element.rel = 'noopener noreferrer';
              element.target = '_blank';
              element.textContent = labelText;
            }
          } catch {
            // Invalid link syntax is displayed as plain text below.
          }
          if (!element) {
            parent.append(document.createTextNode(token));
            lastIndex = pattern.lastIndex;
            continue;
          }
        }

        parent.append(element);
        lastIndex = pattern.lastIndex;
      }

      parent.append(document.createTextNode(text.slice(lastIndex)));
    }

    function renderMarkdown(container, markdown) {
      const sourceLines = markdown.replace(/\r\n?/g, '\n').split('\n');
      const lines = [];
      let insideCodeBlock = false;
      for (const line of sourceLines) {
        if (/^\s*```/.test(line)) {
          insideCodeBlock = !insideCodeBlock;
          lines.push(line);
        } else if (insideCodeBlock) {
          lines.push(line);
        } else {
          lines.push(...line.replace(/\|[ \t]+\|/g, '|\n|').split('\n'));
        }
      }

      let paragraph = [];
      let list = null;
      let codeLines = null;

      function flushParagraph() {
        if (paragraph.length) {
          const p = document.createElement('p');
          appendInline(p, paragraph.join(' '));
          container.appendChild(p);
          paragraph = [];
        }
      }

      function closeList() {
        list = null;
      }

      function tableCells(line) {
        return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
      }

      function isTableDivider(line) {
        const cells = tableCells(line);
        return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
      }

      function appendTableRow(parent, cells, tagName) {
        const row = document.createElement('tr');
        for (const text of cells) {
          const cell = document.createElement(tagName);
          appendInline(cell, text);
          row.appendChild(cell);
        }
        parent.appendChild(row);
      }

      for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
        const line = lines[lineIndex];
        const fence = line.match(/^\s*```/);
        if (codeLines) {
          if (fence) {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = codeLines.join('\n');
            pre.appendChild(code);
            container.appendChild(pre);
            codeLines = null;
          } else {
            codeLines.push(line);
          }
          continue;
        }

        if (fence) {
          flushParagraph();
          closeList();
          codeLines = [];
          continue;
        }

        const heading = line.match(/^\s{0,3}(#{1,4})\s+(.+?)\s*#*\s*$/);
        const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        const quote = line.match(/^\s*>\s?(.*)$/);

        if (line.trim().startsWith('|') && isTableDivider(lines[lineIndex + 1] || '')) {
          flushParagraph();
          closeList();
          const table = document.createElement('table');
          const thead = document.createElement('thead');
          appendTableRow(thead, tableCells(line), 'th');
          table.appendChild(thead);

          const tbody = document.createElement('tbody');
          let rowIndex = lineIndex + 2;
          while (rowIndex < lines.length && lines[rowIndex].trim().startsWith('|')) {
            appendTableRow(tbody, tableCells(lines[rowIndex]), 'td');
            rowIndex++;
          }
          table.appendChild(tbody);
          const wrapper = document.createElement('div');
          wrapper.className = 'table-wrap';
          wrapper.appendChild(table);
          container.appendChild(wrapper);
          lines.splice(lineIndex, rowIndex - lineIndex);
          lineIndex--;
        } else if (heading) {
          flushParagraph();
          closeList();
          const element = document.createElement(`h${heading[1].length}`);
          appendInline(element, heading[2]);
          container.appendChild(element);
        } else if (unordered || ordered) {
          flushParagraph();
          const listType = unordered ? 'ul' : 'ol';
          if (!list || list.tagName.toLowerCase() !== listType) {
            closeList();
            list = document.createElement(listType);
            container.appendChild(list);
          }
          const item = document.createElement('li');
          appendInline(item, (unordered || ordered)[1]);
          list.appendChild(item);
        } else if (quote) {
          flushParagraph();
          closeList();
          const blockquote = document.createElement('blockquote');
          appendInline(blockquote, quote[1]);
          container.appendChild(blockquote);
        } else if (/^\s*([-*_]\s*){3,}$/.test(line)) {
          flushParagraph();
          closeList();
          container.appendChild(document.createElement('hr'));
        } else if (!line.trim()) {
          flushParagraph();
          closeList();
        } else {
          closeList();
          paragraph.push(line.trim());
        }
      }

      if (codeLines) {
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = codeLines.join('\n');
        pre.appendChild(code);
        container.appendChild(pre);
      }
      flushParagraph();
    }

    async function send() {
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      addMessage('user', message);
      input.value = '';
      sendButton.disabled = true;
      const pending = addMessage('assistant', 'Thinking...', 'pending');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }

        const data = await response.json();
        if (typeof data.reply !== 'string') {
          throw new Error('The server returned an invalid response.');
        }

        pending.remove();
        addMessage('assistant', data.reply);
      } catch (error) {
        pending.remove();
        addMessage('assistant', error.message || 'Unable to get a response.', 'error');
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
